# 放进 fork 的 .github/workflows/build-apk.yml，然后在 Actions 里手动运行。
# 产物：artifact "dsh-apk" → app-debug.apk（debug 签名，装之前要先卸载官方版，会清数据）。
name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Android SDK（选一个存在的 android-37.x 平台）
        shell: bash
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" --list > /tmp/sdklist.txt 2>/dev/null || true
          PLATFORM=$(grep -oE 'platforms;android-37[^ ]*' /tmp/sdklist.txt | sort -uV | tail -1)
          [ -n "$PLATFORM" ] || { echo "::error::no android-37 platform in this runner's SDK; 把 /tmp/sdklist.txt 里的 platforms 列表发给我"; exit 1; }
          echo "platform: $PLATFORM"
          BUILD_TOOLS=$(grep -oE 'build-tools;3[67][^ ]*' /tmp/sdklist.txt | sort -uV | tail -1)
          echo "build-tools: $BUILD_TOOLS"
          "$SDKM" --install "$PLATFORM" "platform-tools" ${BUILD_TOOLS:+"$BUILD_TOOLS"}
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Gradle 缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}

      - name: 原生产物（libnode / JNI / addons）
        run: ./native/prebuilt.sh fetch

      - name: 引擎包（engine.zip）
        run: |
          OUT_DIR="$PWD/toolchains/out/engine" ./js/build-engine.sh

      - name: 编译 APK
        run: |
          chmod +x gradlew
          echo "jniLibs:"; ls -l ../toolchains/out/jniLibs/arm64-v8a | head -12
          ./gradlew :app:assembleDebug --no-daemon \
            -Pdsh.engineOut="$PWD/toolchains/out/engine" \
            -Pdsh.nativeOut="$PWD/../toolchains/out/jniLibs"

      - name: 检查 APK 内容
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk)
          ls -l "$APK"
          unzip -l "$APK" | grep -E "lib/arm64-v8a/|assets/engine.zip|assets/shizuku" | sort -k1 -rn | head -20
          echo "--- 目录汇总"
          unzip -l "$APK" | awk 'NR>3{print $1, $4}' | sed -n 's#^\([0-9]*\) \([a-z]*\)/.*#\2#p' | sort | uniq -c
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: dsh-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
